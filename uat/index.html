der:8px solid #d6a63755;box-shadow:0 20px 60px #0006}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;font-size:13px}.primary{background:var(--blue);color:#fff}.gold{background:var(--gold);color:#fff}.light{background:#fff;color:var(--navy)}.danger{background:#fee4e2;color:#9b1c1c}.section{margin-top:28px}.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:15px}.sectionhead h2{margin:0;font-size:25px}.muted{color:var(--muted);font-size:13px;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 3px 12px #0f1d3608;overflow:hidden}.pad{padding:17px}.stat{padding:20px}.stat b{display:block;font-size:28px}.stat span{color:var(--muted);font-size:12px}.photo{width:100%;aspect-ratio:4/3;object-fit:cover;background:#e8edf4}.avatar{width:82px;height:82px;border-radius:50%;object-fit:cover}.pill{display:inline-block;padding:5px 8px;border-radius:99px;background:#eef2f7;color:#475467;font-size:10px;font-weight:800}.goldpill{background:#fff4d6;color:#8b5d00}.greenpill{background:#e4f7ef;color:#087f5b}.redpill{background:#fee4e2;color:#b42318}.eventcard .photo{aspect-ratio:16/9}.eventmeta{display:grid;gap:7px;color:#536173;font-size:12px;margin-top:12px}.searchbar{display:flex;gap:9px;margin:18px 0}.searchbar input,.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff;outline:none}.searchbar input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:#8aa9d0;box-shadow:0 0 0 3px #173f7312}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.filters button{border:1px solid var(--line);background:#fff;padding:8px 11px;border-radius:9px;font-size:11px;font-weight:800}.filters .sel{background:var(--navy);color:#fff}.mgmt{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.member{display:flex;gap:14px;align-items:center}.member img{width:72px;height:72px;border-radius:50%;object-fit:cover}.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.gallery button{border:0;padding:0;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 16px #0f1d3610}.gallery img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}.gallery .cap{padding:9px;text-align:left;font-size:11px}.notice{padding:12px 15px;background:#fff7db;border:1px solid #f2d47a;border-radius:12px;color:#684b00;font-size:12px;margin-bottom:18px}.footer{background:var(--navy);color:#cbd5e1;padding:35px 0}.footer h3{color:#fff;margin:0 0 8px}.footergrid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:30px}.modal{position:fixed;inset:0;background:#061022b8;display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}.modalbox{background:#fff;border-radius:20px;max-width:900px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 25px 80px #0006}.modalhead{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modalbody{padding:20px}.close{border:0;background:#eef2f7;border-radius:9px;padding:8px}.lightbox img{max-height:70vh;max-width:100%;display:block;margin:auto}.adminShell{display:grid;grid-template-columns:230px 1fr;min-height:650px;background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}.side{background:#0d1930;color:#cbd5e1;padding:18px}.side h3{color:#fff;margin:0 0 20px}.side button{width:100%;text-align:left;border:0;background:transparent;color:#cbd5e1;padding:10px 11px;border-radius:9px;font-weight:700;font-size:12px;margin:2px 0}.side button.active,.side button:hover{background:#ffffff12;color:#fff}.adminmain{padding:24px;background:#f8fafc}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:left;font-size:12px;vertical-align:top}.table th{background:#f8fafc;color:#475467}.drop{border:2px dashed #a9bdd7;background:#f2f7fc;padding:28px;text-align:center;border-radius:15px}.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.thumb{position:relative}.thumb img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.thumb button{position:absolute;right:5px;top:5px;border:0;background:#000a;color:#fff;border-radius:50%;width:24px;height:24px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px;font-size:12px;font-weight:800}.field.full{grid-column:1/-1}.toast{position:fixed;right:20px;bottom:20px;background:#10223f;color:#fff;padding:13px 16px;border-radius:12px;box-shadow:var(--shadow);z-index:200;font-size:12px}.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:15px}.small{font-size:11px}.kpirow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.modalwide{max-width:1100px}@media(max-width:900px){.navlinks{display:none}.hero{grid-template-columns:1fr;padding:32px}.heroimg{display:none}.grid,.mgmt{grid-template-columns:1fr 1fr}.gallery{grid-template-columns:repeat(3,1fr)}.adminShell{grid-template-columns:1fr}.side{display:flex;overflow:auto;gap:5px}.side h3{display:none}.side button{width:auto;white-space:nowrap}.kpirow{grid-template-columns:1fr 1fr}}@media(max-width:600px){.topin{font-size:10px}.brand span{display:none}.wrap{padding-left:14px;padding-right:14px}.hero h1{font-size:32px}.grid,.mgmt,.gallery,.footergrid,.formgrid{grid-template-columns:1fr}.kpirow{grid-template-columns:1fr 1fr}.navin{padding:10px 14px}.brand b{font-size:13px}.adminmain{padding:15px}.thumbs{grid-template-columns:repeat(3,1fr)}}

let state=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{return structuredClone(seed)}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function toast(msg){const e=document.createElement('div');e.className='toast';e.textContent=msg;document.body.appendChild(e);setTimeout(()=>e.remove(),2400)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function nav(page){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));renderPage(page);scrollTo({top:0,behavior:'smooth'})}
function shell(content,page='home'){
return `<div class="top"><div class="topin"><span>ASRGH.COM · UAT DEMO</span><span>English · Accessibility A A+ A++ · <button class="ghost" style="color:#fff;padding:3px 6px" onclick="openAdmin()">Admin Portal</button></span></div></div>
<div class="nav"><div class="navin"><button class="brand" onclick="nav('home')"><img src="${logo}"><span><b>Aggarwal Sabha Rohini Group Housing</b><span>ASRGH.COM · Rohini, New Delhi</span></span></button><div class="navlinks">${[['home','Home'],['about','About'],['social','Social Work'],['events','Events'],['gallery','Gallery'],['members','Members'],['management','Management'],['announcements','Announcements'],['contact','Contact']].map(([id,label])=>`<button data-page="${id}" onclick="nav('${id}')" class="${page===id?'active':''}">${label}</button>`).join('')}<button class="adminbtn" onclick="openAdmin()">Admin</button></div></div></div>${content}
<footer class="footer"><div class="wrap footergrid"><div><h3>Aggarwal Sabha Rohini Group Housing</h3><p class="muted" style="color:#aab8cb">A community-focused organization supporting education, healthcare, social welfare and mutual support.</p></div><div><h3>Quick Links</h3><p class="small">Events · Gallery · Members · Management · Announcements</p></div><div><h3>Contact</h3><p class="small">Rohini, New Delhi<br>+91 98765 43210<br>contact@asrgh.com</p></div></div></footer>`}
function renderPage(page='home'){
let c='';
if(page==='home')c=home();
if(page==='about')c=about();
if(page==='social')c=social();
if(page==='events')c=events();
if(page==='gallery')c=gallery();
if(page==='members')c=members();
if(page==='management')c=management();
if(page==='announcements')c=announcements();
if(page==='contact')c=contact();
document.getElementById('app').innerHTML=shell(c,page)
}
function home(){const next=state.events.find(e=>e.status==='upcoming');return `<main class="wrap"><div class="notice">Important: ${esc(state.announcements.find(a=>a.important)?.title||'Community announcement')}</div><section class="hero"><div><span class="eyebrow">Serving the Rohini community</span><h1>Aggarwal Sabha Rohini Group Housing</h1><p>${esc(state.settings.tagline)}. This UAT prototype covers the complete public website and the browser-based admin workflow.</p><button class="btn gold" onclick="nav('events')">Explore Events</button> <button class="btn light" onclick="nav('management')">Current Management</button></div><div class="heroimg"><img src="${logo}" alt="ASRGH logo"></div></section><section class="section"><div class="kpirow">${[['Members',state.members.length],['Events',state.events.length],['Social Work',state.social.length],['Event Albums',state.events.length]].map(x=>`<div class="card stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div></section><section class="section"><div class="sectionhead"><div><h2>Upcoming Events</h2><p class="muted">One event → one album → multiple photos.</p></div><button class="btn primary" onclick="nav('events')">View all</button></div><div class="grid">${state.events.filter(e=>e.status!=='completed').slice(0,3).map(eventCard).join('')}</div></section><section class="section"><div class="sectionhead"><div><h2>Latest Announcements</h2><p class="muted">Public notices and community updates.</p></div></div><div class="grid">${state.announcements.map(a=>`<article class="card pad"><span class="pill ${a.important?'goldpill':''}">${a.important?'Important':'Notice'}</span><h3>${esc(a.title)}</h3><p class="muted">${esc(a.text)}</p><span class="small">${esc(a.date)}</span></article>`).join('')}</div></section></main>`}
function eventCard(e){return `<article class="card eventcard"><img class="photo" src="${e.photos[0]||logo}" alt="${esc(e.title)}"><div class="pad"><span class="pill">${esc(e.category)}</span><h3>${esc(e.title)}</h3><p class="muted">${esc(e.activity)}</p><div class="eventmeta"><span>📅 ${esc(e.date)} · ${esc(e.time)}</span><span>📍 ${esc(e.location)}</span><span>📷 ${e.photos.length} photos in album</span></div><button class="btn primary" style="margin-top:14px" onclick="eventDetail('${e.id}')">View event & album</button></div></article>`}
function about(){return `<main class="wrap"><div class="sectionhead"><div><h1>About ASRGH</h1><p class="muted">History, mission, achievements and milestones.</p></div></div><div class="grid"><article class="card pad"><h2>Our Story</h2><p class="muted">Aggarwal Sabha Rohini Group Housing is presented here as a community organization serving families in Rohini and surrounding areas.</p><p class="muted">The production system will keep this content configurable by administrators.</p></article><article class="card pad"><h2>Mission</h2><p class="muted">Support education, healthcare, social welfare, community unity and transparent administration.</p></article><article class="card pad"><h2>Vision</h2><p class="muted">A connected community where members can easily discover initiatives, events, services and organizational information.</p></article></div><section class="section"><h2>Milestones</h2><div class="grid">${['1998 · Community foundation','2018 · Scholarship program expanded','2024 · Digital member records','2026 · ASRGH.COM digital platform'].map(x=>`<div class="card pad"><span class="goldpill pill">${x.split(' · ')[0]}</span><h3>${x.split(' · ')[1]}</h3><p class="muted">UAT sample milestone.</p></div>`).join('')}</div></section></main>`}
function social(){return `<main class="wrap"><div class="sectionhead"><div><h1>Social Work</h1><p class="muted">Ongoing initiatives and individual projects.</p></div></div><div class="grid">${state.social.map(s=>`<article class="card pad"><span class="pill">${esc(s.category)}</span><h2>${esc(s.title)}</h2><span class="greenpill pill">${esc(s.type)}</span><p class="muted">${esc(s.desc)}</p><p class="small"><b>${s.events}</b> related events</p><button class="btn primary" onclick="nav('events')">View related events</button></article>`).join('')}</div></main>`}
function events(){return `<main class="wrap"><div class="sectionhead"><div><h1>Events</h1><p class="muted">Browse upcoming and completed community events.</p></div></div><div class="filters"><button class="sel" onclick="filterEvents('all',this)">All</button><button onclick="filterEvents('upcoming',this)">Upcoming</button><button onclick="filterEvents('completed',this)">Completed</button></div><div id="eventgrid" class="grid">${state.events.map(eventCard).join('')}</div></main>`}
function filterEvents(type,btn){document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('sel'));btn.classList.add('sel');document.getElementById('eventgrid').innerHTML=state.events.filter(e=>type==='all'||e.status===type).map(eventCard).join('')}
function eventDetail(id){const e=state.events.find(x=>x.id===id);if(!e)return;document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="eventModal"><div class="modalbox modalwide"><div class="modalhead"><div><span class="pill">${esc(e.category)}</span><h2 style="margin:6px 0">${esc(e.title)}</h2><span class="small">${esc(e.date)} · ${esc(e.location)}</span></div><button class="close" onclick="closeModal()">✕</button></div><div class="modalbody"><div class="notice"><b>Album:</b> ${esc(e.album)} · ${e.photos.length} photos · one album for this event</div><p class="muted">This event detail demonstrates the production information architecture: event details are separate from the single associated photo album.</p><div class="gallery">${e.photos.map((p,i)=>`<button onclick="lightbox('${e.id}',${i})"><img src="${p}" alt="Event photo ${i+1}"><div class="cap">Photo ${i+1}</div></button>`).join('')}</div></div></div></div>`)}
function gallery(){const photos=state.events.flatMap(e=>e.photos.map((p,i)=>({p,e,i})));return `<main class="wrap"><div class="sectionhead"><div><h1>Photo Gallery</h1><p class="muted">Event albums with multiple photographs.</p></div></div><div class="filters"><button class="sel" onclick="galleryFilter('all',this)">All Albums</button>${state.events.map(e=>`<button onclick="galleryFilter('${e.id}',this)">${esc(e.album)}</button>`).join('')}</div><div id="gallerygrid" class="gallery">${photos.map((x,i)=>`<button onclick="lightbox('${x.e.id}',${x.i})"><img src="${x.p}" alt="${esc(x.e.title)}"><div class="cap"><b>${esc(x.e.album)}</b><br><span class="small">${esc(x.e.date)} · Photo ${x.i+1}</span></div></button>`).join('')}</div></main>`}
function galleryFilter(id,btn){document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('sel'));btn.classList.add('sel');const photos=state.events.filter(e=>id==='all'||e.id===id).flatMap(e=>e.photos.map((p,i)=>({p,e,i})));document.getElementById('gallerygrid').innerHTML=photos.map(x=>`<button onclick="lightbox('${x.e.id}',${x.i})"><img src="${x.p}" alt="${esc(x.e.title)}"><div class="cap"><b>${esc(x.e.album)}</b><br><span class="small">${esc(x.e.date)} · Photo ${x.i+1}</span></div></button>`).join('')}
function lightbox(id,i){const e=state.events.find(x=>x.id===id);document.body.insertAdjacentHTML('beforeend',`<div class="modal lightbox" id="lightbox"><div class="modalbox" style="max-width:1000px;background:#07101f"><div class="modalhead" style="background:#07101f;color:#fff;border-color:#ffffff22"><div><b>${esc(e.album)}</b><div class="small">${i+1} of ${e.photos.length}</div></div><button class="close" onclick="closeModal()">✕</button></div><div class="modalbody"><img src="${e.photos[i]}" alt="Event photo"></div></div></div>`)}
function members(){return `<main class="wrap"><div class="sectionhead"><div><h1>Members</h1><p class="muted">Public member directory with privacy-aware fields.</p></div></div><div class="searchbar"><input placeholder="Search member name, code or category" oninput="filterMembers(this.value)"></div><div id="membergrid" class="grid">${state.members.map(memberCard).join('')}</div></main>`}
function memberCard(m){return `<article class="card pad"><div class="member"><img src="${m.photo}" alt="${esc(m.name)}"><div><h3 style="margin:0">${esc(m.name)}</h3><p class="muted">${esc(m.designation)}</p><span class="pill">${esc(m.category)}</span></div></div><hr style="border:0;border-top:1px solid var(--line);margin:15px 0"><p class="small"><b>${esc(m.code)}</b> · ${m.management?esc(m.role):'Member'}</p></article>`}
function filterMembers(q){q=q.toLowerCase();document.getElementById('membergrid').innerHTML=state.members.filter(m=>`${m.name} ${m.code} ${m.category} ${m.designation}`.toLowerCase().includes(q)).map(memberCard).join('')||'<div class="empty">No members found.</div>'}
function management(){return `<main class="wrap"><div class="sectionhead"><div><h1>Current Management</h1><p class="muted">Generated from member records where Current Management = Yes.</p></div></div><div class="mgmt">${state.members.filter(m=>m.management).map(m=>`<article class="card pad"><div class="member"><img src="${m.photo}" alt="${esc(m.name)}"><div><span class="goldpill pill">${esc(m.role)}</span><h3>${esc(m.name)}</h3><p class="muted">${esc(m.designation)}</p></div></div></article>`).join('')}</div></main>`}
function announcements(){return `<main class="wrap"><div class="sectionhead"><div><h1>Announcements</h1><p class="muted">Notices and community circulars.</p></div></div><div class="grid">${state.announcements.map(a=>`<article class="card pad"><span class="${a.important?'goldpill':'pill'} pill">${a.important?'Important':'Notice'}</span><h2>${esc(a.title)}</h2><p class="small">${esc(a.code)} · ${esc(a.date)}</p><p class="muted">${esc(a.text)}</p></article>`).join('')}</div></main>`}
function contact(){return `<main class="wrap"><div class="sectionhead"><div><h1>Contact ASRGH</h1><p class="muted">Submit a request. Admin can assign and resolve it without using the terminal.</p></div></div><div class="grid"><form class="card pad" onsubmit="submitContact(event)"><div class="formgrid"><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field full"><label>Subject</label><input name="subject" required></div><div class="field full"><label>Message</label><textarea name="text" rows="5" required></textarea></div></div><button class="btn primary" style="margin-top:15px">Submit request</button></form><div class="card pad"><h2>Registered Office</h2><p class="muted">${esc(state.settings.address)}</p><p class="muted">${esc(state.settings.city)}</p><p class="muted">${esc(state.settings.phone)}<br>${esc(state.settings.email)}</p><a class="btn gold" href="https://wa.me/919876543210" target="_blank">WhatsApp</a></div></div></main>`}
function submitContact(ev){ev.preventDefault();const f=new FormData(ev.target);state.contacts.unshift({id:'c'+Date.now(),code:'CON-2026-'+String(state.contacts.length+22).padStart(3,'0'),name:f.get('name'),subject:f.get('subject'),status:'New',date:new Date().toISOString().slice(0,10),text:f.get('text')});save();toast('Contact request submitted.');ev.target.reset()}
function openAdmin(){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="adminModal"><div class="modalbox modalwide"><div class="modalhead"><div><b>ASRGH Admin Portal</b><div class="small">Browser-only UAT · no terminal required</div></div><button class="close" onclick="closeModal()">✕</button></div><div class="modalbody"><div class="notice"><b>Demo login:</b> admin@asrgh.com · uat-demo. Authentication is simulated in this prototype.</div><div class="adminShell"><aside class="side"><h3>ASRGH Admin</h3>${[['dash','Dashboard'],['members','Members'],['events','Events & Albums'],['social','Social Work'],['ann','Announcements'],['imports','Excel Import'],['reject','Rejected Records'],['contacts','Contact Requests'],['notify','Notifications'],['audit','Audit Log'],['settings','Settings']].map(([id,l])=>`<button id="at-${id}" onclick="adminTab('${id}')">${l}</button>`).join('')}</aside><section class="adminmain" id="adminContent"></section></div></div></div>`);adminTab('dash')}
function adminTab(tab){document.querySelectorAll('.side button').forEach(b=>b.classList.remove('active'));document.getElementById('at-'+tab)?.classList.add('active');const c=document.getElementById('adminContent');if(!c)return;if(tab==='dash')c.innerHTML=adminDash();if(tab==='members')c.innerHTML=adminMembers();if(tab==='events')c.innerHTML=adminEvents();if(tab==='social')c.innerHTML=adminSocial();if(tab==='ann')c.innerHTML=adminAnn();if(tab==='imports')c.innerHTML=adminImports();if(tab==='reject')c.innerHTML=adminReject();if(tab==='contacts')c.innerHTML=adminContacts();if(tab==='notify')c.innerHTML=adminNotify();if(tab==='audit')c.innerHTML=adminAudit();if(tab==='settings')c.innerHTML=adminSettings()}
function adminDash(){return `<div class="toolbar"><div><h2 style="margin:0">Dashboard</h2><p class="muted">UAT overview of public content and administration.</p></div><button class="btn gold" onclick="adminTab('imports')">Upload Excel</button></div><div class="kpirow">${[['Members',state.members.length],['Events',state.events.length],['Albums',state.events.length],['Rejected',state.rejected.filter(x=>x.status==='Rejected').length]].map(x=>`<div class="card stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div><div class="section grid"><div class="card pad"><h3>Recent import</h3><p class="muted">${state.imports[0].file}</p><b>${state.imports[0].accepted} accepted · ${state.imports[0].rejected} rejected</b></div><div class="card pad"><h3>Admin workflow</h3><p class="muted">Upload → Validate → Review accepted/rejected → Commit accepted → Download rejected file.</p></div><div class="card pad"><h3>Photo workflow</h3><p class="muted">Event → one album → multiple local photo uploads → public album/lightbox.</p></div></div>`}
function adminMembers(){return `<div class="toolbar"><div><h2 style="margin:0">Members</h2><p class="muted">Member database and Current Management source.</p></div><button class="btn primary" onclick="addDemoMember()">Add test member</button></div><table class="table"><thead><tr><th>Code</th><th>Name</th><th>Category</th><th>Management</th><th>Status</th></tr></thead><tbody>${state.members.map(m=>`<tr><td>${esc(m.code)}</td><td><b>${esc(m.name)}</b><br><span class="small">${esc(m.designation)}</span></td><td>${esc(m.category)}</td><td>${m.management?'<span class="greenpill pill">Yes · '+esc(m.role)+'</span>':'No'}</td><td>Active</td></tr>`).join('')}</tbody></table>`}
function addDemoMember(){const n=state.members.length+1;state.members.push({id:'m'+Date.now(),code:'MEM-00'+n,name:'UAT Test Member',role:'Member',designation:'Test Designation',category:'General',photo:'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=500',management:false});state.audit.unshift({time:new Date().toLocaleString(),user:'UAT Admin',action:'Created member',module:'Members'});save();adminTab('members');toast('Test member created.')}
function adminEvents(){return `<div class="toolbar"><div><h2 style="margin:0">Events & Albums</h2><p class="muted">Business rule: exactly one album per event.</p></div><button class="btn primary" onclick="openUploadForEvent('${state.events[0].id}')">Upload photos</button></div><div class="grid">${state.events.map(e=>`<article class="card"><img class="photo" src="${e.photos[0]||logo}"><div class="pad"><span class="pill">${esc(e.code)}</span><h3>${esc(e.title)}</h3><p class="muted">${esc(e.date)} · ${esc(e.location)}</p><div class="notice" style="margin:10px 0"><b>Album:</b> ${esc(e.album)}<br>${e.photos.length} photos</div><button class="btn primary" onclick="openUploadForEvent('${e.id}')">Add photos</button></div></article>`).join('')}</div>`}
function adminSocial(){return `<div class="toolbar"><div><h2 style="margin:0">Social Work</h2><p class="muted">Categories and initiatives.</p></div></div><table class="table"><thead><tr><th>Activity</th><th>Category</th><th>Type</th><th>Related Events</th></tr></thead><tbody>${state.social.map(s=>`<tr><td><b>${esc(s.title)}</b><br><span class="small">${esc(s.desc)}</span></td><td>${esc(s.category)}</td><td>${esc(s.type)}</td><td>${s.events}</td></tr>`).join('')}</tbody></table>`}
function adminAnn(){return `<div class="toolbar"><div><h2 style="margin:0">Announcements</h2><p class="muted">Publish notices and mark important items.</p></div><button class="btn primary" onclick="addDemoAnnouncement()">Add test announcement</button></div><table class="table"><thead><tr><th>Code</th><th>Title</th><th>Date</th><th>Status</th></tr></thead><tbody>${state.announcements.map(a=>`<tr><td>${a.code}</td><td>${esc(a.title)}</td><td>${a.date}</td><td><span class="pill ${a.important?'goldpill':''}">${a.status}</span></td></tr>`).join('')}</tbody></table>`}
function addDemoAnnouncement(){state.announcements.unshift({id:'a'+Date.now(),code:'ANN-UAT-'+Date.now().toString().slice(-4),title:'UAT Test Announcement',date:new Date().toISOString().slice(0,10),important:false,status:'Draft',text:'Created from the browser-only UAT admin panel.'});save();adminTab('ann');toast('Draft announcement created.')}
function adminImports(){return `<div class="toolbar"><div><h2 style="margin:0">Excel Import</h2><p class="muted">Admin-friendly workflow for accepted and rejected records.</p></div><button class="btn primary" onclick="simulateImport()">Simulate validation</button></div><div class="drop"><b>Upload Excel file</b><p class="muted">For the source React application, XLSX parsing/validation is included. This standalone UAT demo also supports a simulated validation run without a backend.</p><button class="btn light" onclick="downloadRejected()">Download rejected records</button></div><div class="section"><table class="table"><thead><tr><th>Batch</th><th>Module</th><th>File</th><th>Total</th><th>Accepted</th><th>Rejected</th><th>Status</th></tr></thead><tbody>${state.imports.map(x=>`<tr><td>${x.batch}</td><td>${x.module}</td><td>${x.file}</td><td>${x.total}</td><td>${x.accepted}</td><td>${x.rejected}</td><td>${x.status}</td></tr>`).join('')}</tbody></table></div>`}
function simulateImport(){const n=state.imports.length+1;state.imports.unshift({batch:'BATCH-UAT-'+String(n).padStart(3,'0'),module:'Members',file:'uat_members_upload.xlsx',total:10,accepted:8,rejected:2,warnings:1,status:'Completed'});state.rejected.unshift({id:'r'+Date.now(),batch:state.imports[0].batch,row:4,ref:'MEM-UAT-004',module:'Members',reason:'Duplicate Member Code.',fix:'Use a unique Member Code.',status:'Rejected'},{id:'r'+Date.now()+'b',batch:state.imports[0].batch,row:8,ref:'MEM-UAT-008',module:'Members',reason:'Missing First Name.',fix:'Enter First Name and upload corrected file.',status:'Rejected'});save();adminTab('imports');toast('Validation completed: 8 accepted, 2 rejected.')}
function downloadRejected(){const rows=[['Batch','Module','Row','Reference','Reason','Suggested Fix','Status'],...state.rejected.map(r=>[r.batch,r.module,r.row,r.ref,r.reason,r.fix,r.status])];const csv=rows.map(r=>r.map(x=>`"${String(x).replaceAll('"','""')}"`).join(',')).join('\\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='ASRGH_rejected_records.csv';a.click();toast('Rejected-record file downloaded.')}
function adminReject(){return `<div class="toolbar"><div><h2 style="margin:0">Rejected Records</h2><p class="muted">Correct these records and upload them again.</p></div><button class="btn primary" onclick="downloadRejected()">Download rejected file</button></div><table class="table"><thead><tr><th>Batch</th><th>Row</th><th>Reference</th><th>Reason</th><th>Suggested Fix</th><th>Status</th></tr></thead><tbody>${state.rejected.map(r=>`<tr><td>${r.batch}</td><td>${r.row}</td><td><b>${r.ref}</b></td><td>${esc(r.reason)}</td><td>${esc(r.fix)}</td><td><span class="redpill pill">${r.status}</span></td></tr>`).join('')}</tbody></table>`}
function adminContacts(){return `<div class="toolbar"><div><h2 style="margin:0">Contact Requests</h2><p class="muted">No terminal access required.</p></div></div><table class="table"><thead><tr><th>Code</th><th>Name</th><th>Subject</th><th>Date</th><th>Status</th></tr></thead><tbody>${state.contacts.map(c=>`<tr><td>${c.code}</td><td>${esc(c.name)}</td><td>${esc(c.subject)}<br><span class="small">${esc(c.text)}</span></td><td>${c.date}</td><td><select onchange="contactStatus('${c.id}',this.value)"><option ${c.status==='New'?'selected':''}>New</option><option ${c.status==='Assigned'?'selected':''}>Assigned</option><option ${c.status==='Resolved'?'selected':''}>Resolved</option></select></td></tr>`).join('')}</tbody></table>`}
function contactStatus(id,status){const c=state.contacts.find(x=>x.id===id);if(c)c.status=status;state.audit.unshift({time:new Date().toLocaleString(),user:'UAT Admin',action:'Updated contact status',module:'Contact'});save();toast('Contact status updated.')}
function adminNotify(){return `<div class="toolbar"><div><h2 style="margin:0">Notifications</h2><p class="muted">UAT preview of admin broadcast workflow.</p></div></div><div class="card pad"><div class="formgrid"><div class="field full"><label>Notification title</label><input id="ntitle" value="ASRGH Community Update"></div><div class="field full"><label>Message</label><textarea id="ntext" rows="4">This is a UAT notification.</textarea></div></div><button class="btn primary" style="margin-top:14px" onclick="sendNotify()">Send test notification</button></div>`}
function sendNotify(){state.audit.unshift({time:new Date().toLocaleString(),user:'UAT Admin',action:'Sent test notification',module:'Notifications'});save();toast('Test notification sent to demo devices.')}
function adminAudit(){return `<div class="toolbar"><div><h2 style="margin:0">Audit Log</h2><p class="muted">Every important administrative action is recorded.</p></div></div><table class="table"><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Module</th></tr></thead><tbody>${state.audit.map(a=>`<tr><td>${a.time}</td><td>${esc(a.user)}</td><td>${esc(a.action)}</td><td>${esc(a.module)}</td></tr>`).join('')}</tbody></table>`}
function adminSettings(){return `<div class="toolbar"><div><h2 style="margin:0">Website Settings</h2><p class="muted">Branding and public contact settings.</p></div><button class="btn primary" onclick="saveSettings()">Save settings</button></div><div class="card pad"><div class="formgrid"><div class="field"><label>Organization name</label><input id="sname" value="${esc(state.settings.name)}"></div><div class="field"><label>Website</label><input id="sdomain" value="${esc(state.settings.domain)}"></div><div class="field full"><label>Tagline</label><input id="stag" value="${esc(state.settings.tagline)}"></div><div class="field"><label>Phone</label><input id="sphone" value="${esc(state.settings.phone)}"></div><div class="field"><label>Email</label><input id="semail" value="${esc(state.settings.email)}"></div><div class="field full"><label>Address</label><input id="saddr" value="${esc(state.settings.address)}"></div></div></div><div class="section card pad"><h3>UAT controls</h3><button class="btn danger" onclick="resetUat()">Reset all demo data</button><p class="small muted">This resets browser localStorage to the original ASRGH UAT dataset.</p></div>`}
function saveSettings(){state.settings.name=document.getElementById('sname').value;state.settings.domain=document.getElementById('sdomain').value;state.settings.tagline=document.getElementById('stag').value;state.settings.phone=document.getElementById('sphone').value;state.settings.email=document.getElementById('semail').value;state.settings.address=document.getElementById('saddr').value;state.audit.unshift({time:new Date().toLocaleString(),user:'UAT Admin',action:'Updated website settings',module:'Settings'});save();closeModal();renderPage('home');toast('Settings saved.')}
function resetUat(){if(confirm('Reset all UAT data?')){localStorage.removeItem(KEY);state=load();closeModal();renderPage('home');toast('UAT data reset.')}}
function openUploadForEvent(id){const e=state.events.find(x=>x.id===id);document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="uploadModal"><div class="modalbox"><div class="modalhead"><div><b>Upload Photos to Event Album</b><div class="small">${esc(e.album)} · ${e.photos.length} existing photos</div></div><button class="close" onclick="closeModal()">✕</button></div><div class="modalbody"><div class="field"><label>Choose multiple image files</label><input id="filepick" type="file" accept="image/*" multiple onchange="previewFiles(this,'${e.id}')"></div><div id="previews" class="thumbs" style="margin-top:15px"></div><div class="field" style="margin-top:15px"><label>Caption</label><input id="pcaption" placeholder="Optional caption for selected photos"></div><div style="margin-top:18px;text-align:right"><button class="btn primary" onclick="savePhotos('${e.id}')">Add photos to album</button></div></div></div></div>`)}
let pendingFiles=[];
function previewFiles(input,id){pendingFiles=[];const box=document.getElementById('previews');box.innerHTML='';Array.from(input.files).forEach((f,i)=>{const r=new FileReader();r.onload=()=>{pendingFiles.push({name:f.name,data:r.result});box.insertAdjacentHTML('beforeend',`<div class="thumb"><img src="${r.result}" alt=""><button onclick="this.parentElement.remove()">×</button></div>`)};r.readAsDataURL(f)})}
function savePhotos(id){const e=state.events.find(x=>x.id===id);if(!pendingFiles.length){toast('Choose at least one image.');return}const cap=document.getElementById('pcaption').value;pendingFiles.forEach((f,i)=>e.photos.push(f.data));state.audit.unshift({time:new Date().toLocaleString(),user:'UAT Admin',action:`Uploaded ${pendingFiles.length} photos to ${e.album}`,module:'Gallery'});save();pendingFiles=[];closeModal();adminTab('events');toast('Photos added to the single event album.')}
function closeModal(){document.querySelectorAll('.modal').forEach(m=>m.remove())}
renderPage('home');
</script>
</body>
</html>
